name: Investigar precios (temporal)
on:
  workflow_dispatch:
    inputs:
      terms:
        description: "Búsquedas separadas por |"
        required: true
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar
        env:
          TERMS: ${{ github.event.inputs.terms }}
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, re, os, time
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36","Accept":"application/json,text/html;q=0.9,*/*;q=0.8","Accept-Language":"es-PE,es;q=0.9"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30).read().decode("utf-8","replace")
          VTEX={"Oechsle":"https://www.oechsle.pe","Plaza Vea":"https://www.plazavea.com.pe","Promart":"https://www.promart.pe","Coolbox":"https://www.coolbox.pe"}
          out={}
          for t in [x.strip() for x in os.environ["TERMS"].split("|") if x.strip()]:
              res=[]
              q=urllib.parse.quote(t)
              for st,base in VTEX.items():
                  try:
                      data=json.loads(get(f"{base}/api/catalog_system/pub/products/search?ft={q}&_from=0&_to=11"))
                      for p in data:
                          it=(p.get("items") or [{}])[0]; offers=[s.get("commertialOffer",{}) for s in it.get("sellers",[])]
                          av=[o for o in offers if o.get("AvailableQuantity",0)>0 and o.get("Price")]
                          res.append({"store":st,"name":p.get("productName"),"brand":p.get("brand"),"url":f"{base}/{p.get('linkText')}/p",
                                      "price":min([o["Price"] for o in av]) if av else None,"list":(av[0].get("ListPrice") if av else None),
                                      "seller":(it.get("sellers") or [{}])[0].get("sellerName"),"img":((it.get("images") or [{}])[0]).get("imageUrl")})
                  except Exception as e:
                      res.append({"store":st,"error":str(e)[:80]})
                  time.sleep(1)
              try:
                  doc=get("https://www.falabella.com.pe/falabella-pe/search?Ntt="+urllib.parse.quote_plus(t))
                  m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',doc,re.S)
                  stack=[json.loads(m.group(1))] if m else []
                  n=0
                  while stack and n<24:
                      x=stack.pop()
                      if isinstance(x,dict):
                          if "displayName" in x and "prices" in x:
                              pr=[]
                              for pp in x.get("prices") or []:
                                  for v in pp.get("price") or []:
                                      try: pr.append(float(str(v).replace(",","")))
                                      except: pass
                              res.append({"store":"Falabella","name":x.get("displayName"),"brand":x.get("brand"),"seller":x.get("sellerName"),"price":min(pr) if pr else None,
                                          "url":x.get("url"),"img":(x.get("mediaUrls") or [None])[0]}); n+=1
                          stack.extend(x.values())
                      elif isinstance(x,list): stack.extend(x)
              except Exception as e:
                  res.append({"store":"Falabella","error":str(e)[:80]})
              out[t]=res
          json.dump(out,open("/tmp/resultados.json","w"),ensure_ascii=False,indent=1)
          PY
      - name: Guardar en rama investigacion
        run: |
          git init -q r && cd r && git checkout -q -b investigacion
          cp /tmp/resultados.json . && git add resultados.json
          git -c user.name=zypuc-precios -c user.email=zypuc-precios@users.noreply.github.com commit -qm "Resultados"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" investigacion
