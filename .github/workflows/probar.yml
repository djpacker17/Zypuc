name: Probar tiendas (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import urllib.request, json
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36","Accept":"application/json,text/html;q=0.9,*/*;q=0.8","Accept-Language":"es-PE,es;q=0.9"}
          U=["https://www.oechsle.pe/api/catalog_system/pub/products/search?ft=funko%20pop&_from=0&_to=4",
             "https://www.plazavea.com.pe/api/catalog_system/pub/products/search?ft=funko%20pop&_from=0&_to=4",
             "https://www.promart.pe/api/catalog_system/pub/products/search?ft=balanza&_from=0&_to=4",
             "https://www.coolbox.pe/api/catalog_system/pub/products/search?ft=redmi&_from=0&_to=4",
             "https://api.mercadolibre.com/sites/MPE/search?q=funko%20gojo&limit=3",
             "https://www.sodimac.com.pe/sodimac-pe/search?Ntt=lampara+luna",
             "https://www.tottus.com.pe/tottus-pe/search?Ntt=peluche+stitch",
             "https://simple.ripley.com.pe/audifonos-jbl-on-ear-tune-520bt-bluetooth-53-pure-bass-sound-negro-pmp20000049270",
             "https://www.hiraoka.com.pe/catalogsearch/result/?q=oster"]
          out=[]
          for u in U:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=25); b=r.read(400).decode("utf-8","replace")
                  out.append(f"OK {r.status} {u}\n    "+b.replace("\n"," ")[:300])
              except Exception as e:
                  out.append(f"FAIL {u} {type(e).__name__} {str(e)[:120]}")
          open('probar.txt','w').write('\n'.join(out))
          PY
      - run: |
          git config user.name zypuc-precios; git config user.email zypuc-precios@users.noreply.github.com
          git add probar.txt; git commit -m 'Resultado prueba'; git push
