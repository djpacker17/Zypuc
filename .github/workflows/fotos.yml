name: Buscar fotos (temporal)
on:
  workflow_dispatch:
    inputs:
      terms:
        required: true
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar y bajar miniaturas
        env:
          TERMS: ${{ github.event.inputs.terms }}
        run: |
          pip install pillow requests >/dev/null
          python3 - <<'PY'
          import os, json, requests, io
          from PIL import Image
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129 Safari/537.36","Accept":"application/json"}
          os.makedirs("/tmp/out/t",exist_ok=True); out={}
          for t in [x.strip() for x in os.environ["TERMS"].split("|") if x.strip()]:
              res=[]
              try:
                  r=requests.get("https://api.openverse.org/v1/images/",params={"q":t,"license_type":"commercial,modification","page_size":30,"mature":"false"},headers=H,timeout=40).json()
                  lista=r.get("results",[])
              except Exception as e:
                  out[t]={"error":str(e)}; continue
              for p in lista:
                  if (p.get("width") or 0)<700: continue
                  pid=p["id"][:12]
                  try:
                      im=Image.open(io.BytesIO(requests.get(p.get("thumbnail") or p["url"],headers=H,timeout=30).content)).convert("RGB"); im.thumbnail((360,360)); im.save(f"/tmp/out/t/{pid}.jpg",quality=78)
                  except Exception: continue
                  res.append({"id":pid,"title":p.get("title"),"url":p["url"],"creator":p.get("creator"),"license":p.get("license"),"license_version":p.get("license_version"),"source":p.get("source"),"page":p.get("foreign_landing_url"),"w":p.get("width"),"h":p.get("height")})
                  if len(res)>=10: break
              out[t]=res
          json.dump(out,open("/tmp/out/fotos.json","w"),ensure_ascii=False,indent=1)
          PY
      - name: Guardar en rama investigacion
        run: |
          git init -q r && cd r && git checkout -q -b investigacion
          cp -r /tmp/out/* . && git add -A
          git -c user.name=zypuc -c user.email=zypuc@users.noreply.github.com commit -qm "Fotos"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" investigacion
