name: Buscar fotos (temporal)
on:
  workflow_dispatch:
    inputs:
      terms:
        required: true
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar y bajar miniaturas
        env:
          TERMS: ${{ github.event.inputs.terms }}
        run: |
          pip install pillow requests >/dev/null
          python3 - <<'PY'
          import os, json, requests, io
          from PIL import Image
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129 Safari/537.36","Accept":"application/json"}
          os.makedirs("/tmp/out/t",exist_ok=True); out={}
          import time
          def guardar(pid,thumb,meta,res):
              try:
                  im=Image.open(io.BytesIO(requests.get(thumb,headers=H,timeout=30).content)).convert("RGB")
                  if min(im.size)<200: return
                  im.thumbnail((360,360)); im.save(f"/tmp/out/t/{pid}.jpg",quality=78); res.append({"id":pid,**meta})
              except Exception: pass
          for t in [x.strip() for x in os.environ["TERMS"].split("|") if x.strip()]:
              res=[]
              try:
                  r=requests.get("https://api.openverse.org/v1/images/",params={"q":t,"license_type":"commercial,modification","page_size":20},headers=H,timeout=40)
                  for p in (r.json().get("results",[]) if r.ok else []):
                      guardar("ov"+p["id"][:10],p.get("thumbnail") or p["url"],{"title":p.get("title"),"url":p["url"],"creator":p.get("creator"),"license":p.get("license"),"lv":p.get("license_version"),"page":p.get("foreign_landing_url")},res)
              except Exception as e: print("openverse",t,e)
              time.sleep(3)
              try:
                  r=requests.get("https://commons.wikimedia.org/w/api.php",params={"action":"query","format":"json","generator":"search","gsrsearch":t+" filetype:bitmap","gsrnamespace":6,"gsrlimit":20,"prop":"imageinfo","iiprop":"url|size|extmetadata","iiurlwidth":360},headers={"User-Agent":"ZypucBot/1.0 (tienda escolar)"},timeout=40).json()
                  for pg in (r.get("query",{}).get("pages",{}) or {}).values():
                      ii=(pg.get("imageinfo") or [{}])[0]; em=ii.get("extmetadata",{})
                      if (ii.get("width") or 0)<800: continue
                      guardar("wm"+str(pg["pageid"]),ii.get("thumburl") or ii.get("url"),{"title":pg.get("title"),"url":ii.get("url"),"creator":(em.get("Artist") or {}).get("value",""),"license":(em.get("LicenseShortName") or {}).get("value",""),"page":ii.get("descriptionurl")},res)
              except Exception as e: print("commons",t,e)
              out[t]=res
          json.dump(out,open("/tmp/out/fotos.json","w"),ensure_ascii=False,indent=1)
          PY
      - name: Guardar en rama investigacion
        run: |
          git init -q r && cd r && git checkout -q -b investigacion
          cp -r /tmp/out/* . && git add -A
          git -c user.name=zypuc -c user.email=zypuc@users.noreply.github.com commit -qm "Fotos"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" investigacion
