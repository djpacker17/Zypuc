name: Probar centro de datos
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        env:
          URL: https://script.google.com/macros/s/AKfycbw3T7I7RA1BUC2qqX_Iukx0KwHMqTca_sasC5NAWt7-JzwpRFmNIj8QRaKczT2P37dXwg/exec
          CLAVE: ${{ secrets.ZYPUC_CLAVE }}
        run: |
          r=$(curl -sL "$URL?action=ping" | head -c 300); echo "::notice title=ping::$r"
          r=$(curl -sL "$URL?action=resenas" | head -c 300); echo "::notice title=resenas::$r"
          r=$(curl -sL "$URL?action=pedido&code=ZZTEST" | head -c 300); echo "::notice title=pedido::$r"
          r=$(curl -sL -G "$URL" --data-urlencode "action=equipo" --data-urlencode "key=$CLAVE" | jq -c '{ok,error,pedidos:(.datos.pedidos|length?),resenas:(.datos.resenas|length?)}' 2>&1 | head -c 300); echo "::notice title=equipo::$r"
          r=$(curl -sL -G "$URL" --data-urlencode "action=equipo" --data-urlencode "key=__CLAVE__" | jq -c '{ok,error}' 2>&1 | head -c 200); echo "::notice title=placeholder::$r"
