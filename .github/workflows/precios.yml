name: Actualizar precios

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas (hora UTC)
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/actualizar_precios.py
      - name: Guardar precios.json
        run: |
          if [ -n "$(git status --porcelain precios.json)" ]; then
            git config user.name "zypuc-precios"
            git config user.email "zypuc-precios@users.noreply.github.com"
            git add precios.json
            git commit -m "Precios actualizados"
            git push
          else
            echo "Sin cambios"
          fi
